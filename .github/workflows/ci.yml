name: CI/CD Pipeline for WhatsApp Middleware

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js 16.x
        uses: actions/setup-node@v3
        with:
          node-version: 16

      # Step 3: Install dependencies and test
      - name: Install dependencies and run tests
        run: |
          npm install
          npm run build
          npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Build Docker Image
      - name: Build Docker image
        run: docker build -t whatsapp-middleware:latest .

      # Step 3: Verify Docker Image
      - name: List Docker images
        run: docker images
